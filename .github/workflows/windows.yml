name: Windows client
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --locked --release -p stctl -p st-voice
      - shell: pwsh
        run: |
          mkdir package/bin
          Copy-Item target/release/stctl.exe,target/release/st-voice.exe package/bin
          Copy-Item runtime package/runtime -Recurse
          Copy-Item scripts/models.py,deploy/windows/install.ps1 package/
      - uses: actions/upload-artifact@v4
        with:
          name: stapp-windows-x64
          path: package/
