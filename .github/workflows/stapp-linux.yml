name: Linux
on: [push, pull_request]
defaults:
  run:
    working-directory: stapp
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: npm ci && npm run build
        working-directory: stapp/apps/kiosk
      - run: cargo fmt --all --check && cargo build --release --locked
      - run: python3 scripts/package-room
      - uses: actions/upload-artifact@v4
        with:
          name: stapp-room-linux-x64
          path: stapp/target/distribution/stapp-room-linux-x64.tar.gz
      - run: cargo test --locked -p st-audio -p st-core
      - run: python3 tests/assistant.py && python3 tests/assistant_management.py
      - run: python3 tests/photos.py
      - run: python3 tests/cli.py && python3 tests/immich_access.py
      - run: python3 -m venv .cache/planner-venv && .cache/planner-venv/bin/pip install -r runtime/planner-requirements.txt
      - run: .cache/planner-venv/bin/python tests/planner.py
      - run: python3 ../sm-manager/scripts/build-dave.py --checkout .cache/dave --source-archive .cache/dave-source.tar.gz
      - run: DAVE_CHECKOUT="$PWD/.cache/dave" .cache/planner-venv/bin/python tests/planner_dave.py -v
