name: Windows client
on:
  push:
    branches: [main, feature/st-assistant-with-laya]
  pull_request:
  workflow_dispatch:
defaults:
  run:
    working-directory: stapp
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --locked --release -p stctl -p st-voice
      - shell: pwsh
        run: |
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path deploy/windows/install.ps1),[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
          ./deploy/windows/package.ps1
      - shell: pwsh
        run: |
          python scripts/models.py .cache/speech-models
          if ($LASTEXITCODE) { throw 'Speech asset setup failed' }
          $env:STAPP_MODELS=(Resolve-Path .cache/speech-models).Path
          $env:STAPP_ESPEAK_LIBRARY=(Resolve-Path package/bin/libespeak-ng.dll).Path
          $env:STAPP_TTS_NOISE_SCALE='0.0001'
          $env:STAPP_TTS_NOISE_SCALE_W='0.0001'
          $run=Start-Process target/release/st-voice.exe -ArgumentList '--synthesize "Okay, ess tee. Please list my tasks." --output .cache/speech-smoke.wav' -Wait -PassThru
          if ($run.ExitCode -ne 0 -or -not (Test-Path .cache/speech-smoke.wav)) { throw 'Native speech generation failed' }
          $run=Start-Process target/release/st-voice.exe -ArgumentList '--check-audio .cache/speech-smoke.wav' -RedirectStandardOutput .cache/speech-smoke.txt -Wait -PassThru
          if ($run.ExitCode -ne 0 -or -not (Select-String -Path .cache/speech-smoke.txt -Pattern 'confirmed_count: 1')) { throw 'Native keyword/transcription smoke failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: stapp-windows-x64
          path: stapp/package/
