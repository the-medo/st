# Based on the official v3.4.2 release compose file.
# systemd owns restarts so the NAS is checked before every startup.
name: stapp-immich

services:
  immich-server:
    container_name: stapp-immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:?Set a pinned release}
    # extends:
    #   file: hwaccel.transcoding.yml
    #   service: cpu # set to one of [nvenc, quicksync, rkmpp, vaapi, vaapi-wsl] for accelerated transcoding
    volumes:
      # Do not edit the next line. If you want to change the media storage location on your system, edit the value of UPLOAD_LOCATION in the .env file
      - type: bind
        source: ${UPLOAD_LOCATION}
        target: /data
        bind:
          create_host_path: false
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      # Do not use IMMICH_PORT here: env_file also reaches machine learning,
      # which must keep its own default internal listener on port 3003.
      - '127.0.0.1:${ST_IMMICH_PORT:-2283}:2283'
    depends_on:
      - redis
      - database
    restart: "no"
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: stapp-immich_machine_learning
    # For hardware acceleration, add one of -[armnn, cuda, rocm, openvino, rknn] to the image tag.
    # Example tag: ${IMMICH_VERSION:?Set a pinned release}-cuda
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:?Set a pinned release}
    # extends: # uncomment this section for hardware acceleration - see https://docs.immich.app/features/ml-hardware-acceleration
    #   file: hwaccel.ml.yml
    #   service: cpu # set to one of [armnn, cuda, rocm, openvino, openvino-wsl, rknn] for accelerated inference - use the `-wsl` version for WSL2 where applicable
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    environment:
      MACHINE_LEARNING_MODEL_REVISION: v2
    restart: "no"
    healthcheck:
      disable: false

  redis:
    container_name: stapp-immich_redis
    image: docker.io/valkey/valkey:9@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    restart: "no"

  database:
    container_name: stapp-immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      # Uncomment the DB_STORAGE_TYPE: 'HDD' var if your database isn't stored on SSDs
      # DB_STORAGE_TYPE: 'HDD'
    volumes:
      # Do not edit the next line. If you want to change the database storage location on your system, edit the value of DB_DATA_LOCATION in the .env file
      - type: bind
        source: ${DB_DATA_LOCATION}
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    shm_size: 128mb
    restart: "no"
    healthcheck:
      disable: false

volumes:
  model-cache:
